name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: 流水线自测（不需要 torch 与模型）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 自测用玩具语料、桩模块与 dummy 打分，只依赖标准库
      - name: tests/selftest.py
        run: python tests/selftest.py "$RUNNER_TEMP/selftest"
